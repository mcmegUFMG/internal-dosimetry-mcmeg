<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAF Scientific Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  :root {
    /* Minimal Light Theme (Default) */
    --bg-main: #F8FAFC; /* Slate 50 */
    --bg-panel: #FFFFFF;
    --bg-input: #FFFFFF;
    --text-main: #0F172A; /* Slate 900 */
    --text-muted: #64748B; /* Slate 500 */
    --border: #E2E8F0; /* Slate 200 */
    --border-hover: #CBD5E1;
    --accent: #0F172A;
    --text-accent: #FFFFFF;
    --chart-grid: #F1F5F9; /* Slate 100 */
    --overlay: rgba(15, 23, 42, 0.4);
    
    /* Scientific Chart Colors */
    --c-phits: #2563EB; /* Blue 600 */
    --c-icrp: #64748B; /* Slate 500 */
    --c-delta: #EF4444; /* Red 500 */
    
    --radius: 8px;
    --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
  }

  [data-theme="dark"] {
    /* Refined Dark Theme */
    --bg-main: #0F172A; /* Slate 900 */
    --bg-panel: #1E293B; /* Slate 800 */
    --bg-input: #1E293B;
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --border: #334155; /* Slate 700 */
    --border-hover: #475569;
    --accent: #38BDF8;
    --text-accent: #0F172A;
    --chart-grid: #1E293B;
    --overlay: rgba(15, 23, 42, 0.8);
    
    --c-phits: #38BDF8; /* Sky 400 */
    --c-icrp: #94A3B8; /* Slate 400 */
    --c-delta: #F87171; /* Red 400 */
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; overflow: hidden;
    background: var(--bg-main);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    height: 100vh; display: flex;
    transition: background 0.2s ease, color 0.2s ease;
  }

  /* CHARTS AREA */
  .charts-container {
    flex: 1; display: flex; flex-direction: column;
    padding: 24px 24px 24px 340px; gap: 24px; height: 100vh;
  }
  .chart-box {
    position: relative; background: var(--bg-panel);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; display: flex; flex-direction: column;
    box-shadow: var(--shadow);
  }
  .chart-main { flex: 3; min-height: 0; }
  .chart-delta { flex: 1; min-height: 0; }
  .chart-delta.hidden { display: none !important; }
  .canvas-wrapper { position: relative; flex: 1; min-height: 0; width: 100%; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  
  /* FLOATING UI */
  .floating-panel {
    position: absolute; top: 24px; left: 24px; bottom: 24px; width: 292px;
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    display: flex; flex-direction: column; z-index: 100;
  }
  
  .panel-header { padding: 24px 24px 20px; border-bottom: 1px solid var(--border); }
  .panel-header h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .panel-header .subtitle {
    font-size: 12px; color: var(--text-muted); margin-top: 4px; font-weight: 400;
  }

  .panel-content { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  
  .field-group { display: flex; flex-direction: column; gap: 8px; }
  .field-label {
    font-size: 12px; font-weight: 500; color: var(--text-main);
  }
  
  select {
    appearance: none; background: var(--bg-input); color: var(--text-main);
    border: 1px solid var(--border); padding: 10px 32px 10px 12px; border-radius: 6px;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 400; cursor: pointer;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2214%22%20height%3D%2214%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2364748B%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat; background-position: right 12px center;
    transition: border-color 0.1s;
  }
  select:hover { border-color: var(--border-hover); }
  select:focus { outline: none; border-color: var(--accent); }

  .toggle-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-muted); cursor: pointer; }
  .toggle-row input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; margin: 0; }

  .panel-footer { padding: 20px 24px; border-top: 1px solid var(--border); display: flex; flex-direction: column; }
  .btn {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
    padding: 10px 16px; border-radius: 6px; background: var(--text-main); color: var(--bg-main);
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
  
  .btn-icon { padding: 6px; background: transparent; border: 1px solid transparent; color: var(--text-muted); cursor: pointer; border-radius: 4px; transition: background 0.15s; }
  .btn-icon:hover { color: var(--text-main); background: var(--chart-grid); }

  /* DATA MANAGER MODAL */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--overlay);
    display: none; justify-content: center; align-items: center; z-index: 1000;
  }
  .modal-overlay.active { display: flex; }
  .modal-content {
    width: 90%; max-width: 1200px; height: 85vh; background: var(--bg-main);
    border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-direction: column; box-shadow: var(--shadow);
  }
  .modal-header {
    background: var(--bg-panel); padding: 20px 24px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-header h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .modal-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  
  .manager-controls {
    display: flex; gap: 16px; padding: 16px 24px; background: var(--bg-panel);
    border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center;
  }
  .mc-group { display: flex; align-items: center; gap: 4px; background: var(--bg-input); padding: 4px; border-radius: 6px; border: 1px solid var(--border); }
  .mc-group select { border: none; background: transparent; padding: 6px 32px 6px 12px; font-weight: 500; }
  
  .table-scroll { flex: 1; overflow: auto; padding: 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--border); padding: 8px 12px; text-align: left; background: var(--bg-panel); }
  th {
    font-weight: 500; color: var(--text-muted); position: sticky; top: 0; z-index: 10;
    background: var(--bg-input); border-bottom: 1px solid var(--border);
  }
  td input {
    width: 100%; background: transparent; border: 1px solid transparent; color: var(--text-main);
    padding: 6px 8px; border-radius: 4px; font-family: 'Inter', monospace; font-size: 13px;
  }
  td input:focus { border-color: var(--accent); outline: none; }
  .row-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
  tr:hover .row-actions { opacity: 1; }
  
  .paste-hint {
    background: var(--chart-grid); color: var(--text-muted); padding: 12px 16px; border-radius: 6px;
    font-size: 13px; display: flex; align-items: center; gap: 8px; margin-bottom: 20px;
  }
  .multi-select-container {
    display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; background: var(--bg-panel); border: 1px solid var(--border); padding: 8px; border-radius: 6px;
  }
  .multi-select-container label {
    display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 13px; cursor: pointer; color: var(--text-main); margin-bottom: 0;
  }
  .multi-select-container input[type="checkbox"] { margin: 0; }
</style>
</head>
<body>

<div class="floating-panel">
  <div class="panel-header">
    <h1>SAF Explorer</h1>
    <div class="subtitle">Dosimetry Analytics</div>
  </div>
  <div class="panel-content">
    <div class="field-group">
      <div class="field-label">Phantom</div>
      <select id="phantomSelect"></select>
    </div>
    <div class="field-group">
      <div class="field-label">Particle</div>
      <select id="particleSelect"></select>
    </div>
    <div class="field-group">
      <div class="field-label">Source Organ</div>
      <select id="sourceSelect"></select>
    </div>
    <div class="field-group">
      <label class="field-label">Target Organ(s)</label>
      <div id="selTargetContainer" class="multi-select-container"></div>
    </div>
    
    <div style="height:1px; background:var(--border); margin: 8px 0;"></div>
    
    <div class="field-group">
      <div class="field-label" style="margin-bottom:4px;">Display</div>
      <label class="toggle-row">
        <input type="checkbox" id="showErrorBars" checked>
        <span>SD Bars</span>
      </label>
    </div>
    
    <div class="field-group" style="margin-top:auto;">
      <div class="field-label">Theme</div>
      <select id="themeSelect">
        <option value="light">Light Mode</option>
        <option value="dark">Dark Mode</option>
      </select>
    </div>
  </div>
  <div class="panel-footer">
    <button class="btn" id="btnOpenManager">Data Manager</button>
  </div>
</div>

<div class="charts-container">
  <div class="chart-box chart-main">
    <div class="canvas-wrapper">
      <canvas id="chartMain"></canvas>
    </div>
  </div>
</div>

<!-- DATA MANAGER -->
<div class="modal-overlay" id="managerModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Data Manager</h2>
        <div class="modal-actions" style="margin-top:20px; display:flex; justify-content:flex-end; gap:12px;">
          <input type="file" id="excelUpload" accept=".xlsx, .xls" style="display:none;" />
          <button class="btn btn-outline" onclick="document.getElementById('excelUpload').click()">Import Excel</button>
          <button class="btn" id="btnCloseManager">Close</button>
        </div>
    </div>
    <div class="modal-body">
      <div class="manager-controls">
        <div class="mc-group"><select id="manPhantom"></select><button class="btn-icon" onclick="deleteEntity('phantom')" title="Delete Phantom">🗑️</button></div>
        <div class="mc-group"><select id="manParticle"></select><button class="btn-icon" onclick="deleteEntity('particle')" title="Delete Particle">🗑️</button></div>
        <div class="mc-group"><select id="manSource"></select><button class="btn-icon" onclick="deleteEntity('source')" title="Delete Source Organ">🗑️</button></div>
        <div class="mc-group"><select id="manTarget"></select><button class="btn-icon" onclick="deleteEntity('target')" title="Delete Target Organ">🗑️</button></div>
      </div>
      <div style="padding: 12px 24px; background: rgba(37, 99, 235, 0.05); font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border);">
        <strong>Excel Import Format:</strong> Name your sheets as <strong>Source Organs</strong>. Use columns: <strong>A</strong> (Target Organ, write only on first row of block), <strong>B</strong> (Energy), <strong>C</strong> (PHITS), <strong>G</strong> (SD).
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Energy (MeV)</th><th>PHITS (kg⁻¹)</th><th>SD</th></tr></thead>
          <tbody id="manTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  /* DATA_PLACEHOLDER */

  let appData = JSON.parse(JSON.stringify(INITIAL_DATA));
  let chartMain = null;
  let selPhan = "", selPart = "", selSrc = "";
  let selTgts = [];
  let manPhan = "", manPart = "", manSrc = "", manTgt = "";

  const sel = { p: document.getElementById('phantomSelect'), pa: document.getElementById('particleSelect'), s: document.getElementById('sourceSelect') };
  const msel = { p: document.getElementById('manPhantom'), pa: document.getElementById('manParticle'), s: document.getElementById('manSource'), t: document.getElementById('manTarget') };

  function init() {
    const phans = Object.keys(appData);
    if(phans.length > 0) {
      selPhan = phans[0];
      const parts = Object.keys(appData[selPhan]);
      if(parts.length > 0) {
        selPart = parts[0];
        const srcs = Object.keys(appData[selPhan][selPart]);
        if(srcs.length > 0) { selSrc = srcs[0]; const tgts = Object.keys(appData[selPhan][selPart][selSrc]); if(tgts.length > 0) selTgts = [tgts[0]]; }
      }
    }
    refreshDropdowns();
    initCharts();

    sel.p.addEventListener('change', e => { selPhan = e.target.value; updateCascading(1); updateCharts(); });
    sel.pa.addEventListener('change', e => { selPart = e.target.value; updateCascading(2); updateCharts(); });
    sel.s.addEventListener('change', e => { selSrc = e.target.value; updateCascading(3); updateCharts(); });

    document.getElementById('showErrorBars').addEventListener('change', () => { chartMain.update(); });
    document.getElementById('themeSelect').addEventListener('change', e => { document.body.setAttribute('data-theme', e.target.value); updateCharts(); });

    document.getElementById('btnOpenManager').addEventListener('click', openManager);
    document.getElementById('btnCloseManager').addEventListener('click', () => {
      refreshDropdowns();
      updateCharts();
      document.getElementById('managerModal').classList.remove('active');
    });

    msel.p.addEventListener('change', e => { manPhan = e.target.value; updateManCascading(1); renderManTable(); });
    msel.pa.addEventListener('change', e => { manPart = e.target.value; updateManCascading(2); renderManTable(); });
    msel.s.addEventListener('change', e => { manSrc = e.target.value; updateManCascading(3); renderManTable(); });
    msel.t.addEventListener('change', e => { manTgt = e.target.value; renderManTable(); });
  }

  function getKeys(obj) { return obj ? Object.keys(obj) : []; }
  function fill(el, items, selected) { el.innerHTML = items.map(i => `<option value="${i}">${i}</option>`).join(''); if(items.includes(selected)) el.value = selected; else if(items.length > 0) el.value = items[0]; return el.value; }
  function updateCascading(lvl) {
    if(lvl <= 1) selPart = fill(sel.pa, getKeys(appData[selPhan]), selPart);
    if(lvl <= 2) selSrc = fill(sel.s, getKeys(appData[selPhan]?.[selPart]), selSrc);
    if(lvl <= 3) {
      const tgts = getKeys(appData[selPhan]?.[selPart]?.[selSrc]);
      renderMultiTargets(tgts);
    }
  }
  function refreshDropdowns() { selPhan = fill(sel.p, getKeys(appData), selPhan); updateCascading(1); }

  function renderMultiTargets(tgts) {
    const container = document.getElementById('selTargetContainer');
    if(!tgts || tgts.length === 0) {
      container.innerHTML = '<span style="color:var(--text-muted); font-size:12px;">No targets</span>';
      selTgts = [];
      return;
    }
    selTgts = selTgts.filter(t => tgts.includes(t));
    if(selTgts.length === 0 && tgts.length > 0) selTgts = [tgts[0]];

    container.innerHTML = tgts.map(t => `
      <label>
        <input type="checkbox" value="${t}" ${selTgts.includes(t) ? 'checked' : ''}>
        ${t}
      </label>
    `).join('');

    Array.from(container.querySelectorAll('input[type="checkbox"]')).forEach(cb => {
      cb.addEventListener('change', (e) => {
        if(e.target.checked) { if(!selTgts.includes(e.target.value)) selTgts.push(e.target.value); }
        else { selTgts = selTgts.filter(v => v !== e.target.value); }
        updateCharts();
      });
    });
  }

  const errorBarPlugin = {
    id: 'errorBars',
    afterDatasetsDraw(c) {
      if(!document.getElementById('showErrorBars').checked) return;
      const ctx = c.ctx;
      c.data.datasets.forEach((ds, i) => {
        const ySc = c.scales.y;
        const xSc = c.scales.x;
        
        for(let idx = 0; idx < ds.data.length; idx++) {
          const raw = ds.data[idx];
          if(!raw || raw.y == null || raw._err == null) continue;
          
          const y = raw.y;
          const abs = raw._err;
          
          let yUpper = ySc.getPixelForValue(y + abs);
          let lowerVal = y - abs;
          if (lowerVal <= 0) lowerVal = y * 0.1;
          let yLower = ySc.getPixelForValue(lowerVal);
          
          const ptX = xSc.getPixelForValue(raw.x);
          
          ctx.save();
          ctx.strokeStyle = ds.borderColor;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          
          ctx.moveTo(ptX, yUpper); ctx.lineTo(ptX, yLower);
          ctx.moveTo(ptX - 4, yUpper); ctx.lineTo(ptX + 4, yUpper);
          ctx.moveTo(ptX - 4, yLower); ctx.lineTo(ptX + 4, yLower);
          
          ctx.stroke();
          ctx.restore();
        }
      });
    }
  };

  Chart.register(errorBarPlugin);

  function getCss(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function sciNot(val) { return (val === 0 || val == null) ? "0" : val.toExponential(2); }
  function toSuperscript10(exp) {
    const map = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
    return '10' + exp.toString().split('').map(c => map[c] || c).join('');
  }

  function initCharts() {
    const tooltipOpts = {
      callbacks: {
        label: function(ctx) {
          const raw = ctx.raw;
          let text = `${ctx.dataset.label}: ${sciNot(raw.y)}`;
          if(raw._err != null) { text += ` ± ${sciNot(raw._err)}`; }
          return text;
        }
      }
    };
    
    const opts = { responsive: true, maintainAspectRatio: false, interaction: { mode: 'nearest', intersect: true } };
    
    const xAxesConf = { 
      type: 'logarithmic', 
      title: { display: true, text: 'Energy (MeV)' }, 
      min: 0.01,
      max: 5,
      ticks: { 
        callback: function(val) { 
          const log10 = Math.log10(val);
          if (Number.isInteger(Math.round(log10 * 100000)/100000)) {
            return toSuperscript10(Math.round(log10));
          }
          return '';
        },
        maxRotation: 0,
        autoSkip: false
      } 
    };

    chartMain = new Chart(document.getElementById('chartMain'), {
      type: 'line', data: { datasets: [] },
      options: { 
        ...opts, 
        plugins: { tooltip: tooltipOpts },
        scales: { 
          x: xAxesConf, 
          y: { 
            type: 'logarithmic', 
            title: { display: true, text: 'SAF (kg⁻¹)' },
            afterFit: function(scale) { scale.width = 110; },
            ticks: { 
               callback: function(val) { 
                 const log10 = Math.log10(val);
                 if (Number.isInteger(Math.round(log10 * 100000)/100000)) {
                   return toSuperscript10(Math.round(log10));
                 }
                 return ''; 
               } 
            } 
          } 
        } 
      }
    });
    updateCharts();
  }

  const COLORS = ['#2563EB', '#EF4444', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#06B6D4', '#EAB308', '#6366F1', '#14B8A6'];

  function updateCharts() {
    if(!chartMain) return;
    
    let dMain = [];
    let colorIdx = 0;

    for (const t of selTgts) {
      const ds = appData[selPhan]?.[selPart]?.[selSrc]?.[t];
      if(!ds || !ds.energy || ds.energy.length === 0) continue;

      let pPhits = ds.energy.map((e, i) => ({ x: e, y: ds.phits[i], _err: ds.sd[i] })).filter(p => p.y != null);
      
      const color = COLORS[colorIdx % COLORS.length];
      
      dMain.push({
        label: `${t} (PHITS)`, data: pPhits, borderColor: color, backgroundColor: color,
        borderWidth: 2, pointRadius: 3, pointBackgroundColor: getCss('--bg-panel'), pointBorderWidth: 1.5,
        tension: 0
      });
      colorIdx++;
    }

    if(dMain.length === 0) {
      chartMain.data.datasets = []; chartMain.update(); return;
    }
    
    const cT = getCss('--text-main'), cG = getCss('--chart-grid');
    chartMain.data.labels = undefined;
    
    const fontOpts = { family: 'Inter', size: 11 };

    const apThm = (ch, xT) => {
      ch.options.scales.x.grid.color = cG; ch.options.scales.x.ticks.color = cT; ch.options.scales.x.ticks.font = fontOpts;
      if(xT) { ch.options.scales.x.title.color = cT; ch.options.scales.x.title.font = fontOpts; }
      ch.options.scales.y.grid.color = cG; ch.options.scales.y.ticks.color = cT; ch.options.scales.y.ticks.font = fontOpts;
      ch.options.scales.y.title.color = cT; ch.options.scales.y.title.font = fontOpts;
    };
    apThm(chartMain, true);
    chartMain.options.plugins.legend.labels.color = cT;
    chartMain.options.plugins.legend.labels.font = { family: 'Inter', size: 12, weight: 500 };
    chartMain.options.plugins.legend.labels.boxWidth = 12;

    chartMain.data.datasets = dMain;
    chartMain.update();
  }

  function openManager() { manPhan = selPhan; manPart = selPart; manSrc = selSrc; manTgt = (selTgts && selTgts.length > 0) ? selTgts[0] : ""; refreshManDropdowns(); renderManTable(); document.getElementById('managerModal').classList.add('active'); }
  function deleteEntity(type) { if(!confirm(`Delete this ${type} and all its data?`)) return; if(type === 'phantom') { delete appData[manPhan]; manPhan = ""; } else if(type === 'particle') { delete appData[manPhan][manPart]; manPart = ""; } else if(type === 'source') { delete appData[manPhan][manPart][manSrc]; manSrc = ""; } else if(type === 'target') { delete appData[manPhan][manPart][manSrc][manTgt]; manTgt = ""; } refreshManDropdowns(); renderManTable(); }
  function updateManCascading(l) { if(l<=1) manPart = fill(msel.pa, getKeys(appData[manPhan]), manPart); if(l<=2) manSrc = fill(msel.s, getKeys(appData[manPhan]?.[manPart]), manSrc); if(l<=3) manTgt = fill(msel.t, getKeys(appData[manPhan]?.[manPart]?.[manSrc]), manTgt); }
  function refreshManDropdowns() { manPhan = fill(msel.p, getKeys(appData), manPhan); updateManCascading(1); }

  function renderManTable() {
    const tbody = document.getElementById('manTableBody'); 
    const ds = appData[manPhan]?.[manPart]?.[manSrc]?.[manTgt];
    if(!ds || !ds.energy || ds.energy.length === 0) { 
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 20px;">No data available.</td></tr>'; 
      return; 
    }
    let html = ''; 
    for(let i=0; i<ds.energy.length; i++) { 
      const e = ds.energy[i] != null ? ds.energy[i] : '';
      const p = ds.phits[i] != null ? ds.phits[i] : '';
      const s = ds.sd[i] != null ? ds.sd[i] : '';
      html += `<tr><td>${e}</td><td>${p}</td><td>${s}</td></tr>`; 
    }
    tbody.innerHTML = html;
  }

    document.getElementById('excelUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = evt.target.result;
          const workbook = XLSX.read(data, {type: 'array'});
          
          if(!manPhan) {
            manPhan = "Imported Phantom";
            appData[manPhan] = {};
          }
          if(!manPart) {
            manPart = "Imported Particle";
            if(!appData[manPhan]) appData[manPhan] = {};
            appData[manPhan][manPart] = {};
          }
          
          let firstImportedSheet = null;
          
          workbook.SheetNames.forEach(sheetName => {
            const sheet = workbook.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(sheet, {header: 1});
            
            const sourceName = sheetName.trim();
            if(!firstImportedSheet) firstImportedSheet = sourceName;
            
            if(!appData[manPhan][manPart][sourceName]) {
              appData[manPhan][manPart][sourceName] = {};
            }
            
            let currentTarget = null;
            let dataPoints = 0;
            
            for(let i=0; i<rows.length; i++) {
              const row = rows[i];
              if(!row || row.length < 2) continue;
              
              if(row[0] !== undefined && row[0] !== null && String(row[0]).trim() !== "") {
                const parsedTgt = String(row[0]).trim();
                if(parsedTgt.toLowerCase() !== "target (organ / tissue)") {
                  currentTarget = parsedTgt;
                  if(!appData[manPhan][manPart][sourceName][currentTarget]) {
                    appData[manPhan][manPart][sourceName][currentTarget] = {
                      energy: [], phits: [], sd: []
                    };
                  }
                }
              }
              
              if(currentTarget) {
                const parse = (v) => { 
                  if(v === undefined || v === null || String(v).trim() === "") return null;
                  const n = parseFloat(String(v).replace(',', '.')); 
                  return isNaN(n) ? null : n; 
                };
                
                const eng = parse(row[1]);
                const phits_val = parse(row[2]);
                
                if(eng !== null && phits_val !== null) {
                  appData[manPhan][manPart][sourceName][currentTarget].energy.push(eng);
                  appData[manPhan][manPart][sourceName][currentTarget].phits.push(phits_val);
                  appData[manPhan][manPart][sourceName][currentTarget].sd.push(parse(row[6]));
                  dataPoints++;
                }
              }
            }
          });
          
          document.getElementById('excelUpload').value = "";
          
          // Force the UI to switch to the newly imported data so the user physically sees it
          if(firstImportedSheet) {
             manSrc = firstImportedSheet;
             manTgt = ""; // Forces it to select the first target organ
          }
          
          alert(`Excel data successfully imported! Check the dropdowns. \n(Loaded data into ${manPhan} -> ${manPart})`);
          refreshManDropdowns();
          renderManTable();
        } catch(err) {
          document.getElementById('excelUpload').value = "";
          alert("Error parsing Excel file. Ensure it is a valid .xlsx file formatted correctly.");
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    });

  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
